name: Infrastructure Management

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy infrastructure'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - hml
          - prd
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy
  push:
    paths:
      - 'terraform/**'
    branches:
      - prd
      - hml
      - dev

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      action: ${{ steps.env.outputs.action }}
    steps:
      - name: Determine environment and action
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/prd" ]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
            echo "action=apply" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/hml" ]; then
            echo "environment=hml" >> $GITHUB_OUTPUT
            echo "action=apply" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "action=apply" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "action=apply" >> $GITHUB_OUTPUT
          fi

  setup-prerequisites:
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project config
        id: config
        run: |
          PROJECT_NAME=$(jq -r '.project.name' config.json)
          DOMAIN=$(jq -r '.project.domain' config.json)
          REGION=$(jq -r '.aws.region' config.json)
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          INSTANCE_TYPE=$(jq -r ".infrastructure.instance_types.${ENVIRONMENT}" config.json)
          
          echo "project_name=${PROJECT_NAME}" >> $GITHUB_OUTPUT
          echo "domain=${DOMAIN}" >> $GITHUB_OUTPUT
          echo "aws_region=${REGION}" >> $GITHUB_OUTPUT
          echo "instance_type=${INSTANCE_TYPE}" >> $GITHUB_OUTPUT

      - name: Debug Setup Info
        run: |
          echo "🔍 Setting up AWS infrastructure..."
          echo "Project: ${{ vars.PROJECT_NAME || steps.config.outputs.project_name }}"
          echo "Environment: ${{ github.environment }}"
          echo "Region: ${{ vars.AWS_REGION || steps.config.outputs.aws_region }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || steps.config.outputs.aws_region }}

      - name: Prepare SSH Key
        id: prepare-key
        run: |
          # Use step output to bypass GitHub Actions secret masking
          echo "encoded_key=${{ vars.EC2_PRIVATE_KEY }}" >> $GITHUB_OUTPUT

      - name: Setup AWS Prerequisites (Auto)
        run: |
          # Determine values with fallbacks
          PROJECT_NAME="${{ vars.PROJECT_NAME }}"
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="${{ steps.config.outputs.project_name }}"
          fi
          
          AWS_REGION="${{ vars.AWS_REGION }}"
          if [ -z "$AWS_REGION" ]; then
            AWS_REGION="${{ steps.config.outputs.aws_region }}"
          fi
          
          # Create S3 bucket for Terraform state
          BUCKET_NAME="${PROJECT_NAME}-terraform-state"
          
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "🚀 Creating S3 bucket: $BUCKET_NAME"
            
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET_NAME"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET_NAME" \
                --create-bucket-configuration LocationConstraint=$AWS_REGION
            fi
            
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled
            
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET_NAME" \
              --server-side-encryption-configuration '{
                "Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]
              }'
          fi
          
          # Create DynamoDB table for Terraform locks
          TABLE_NAME="${PROJECT_NAME}-terraform-locks"
          
          if ! aws dynamodb describe-table --table-name "$TABLE_NAME" 2>/dev/null; then
            echo "🚀 Creating DynamoDB table: $TABLE_NAME"
            
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5
            
            aws dynamodb wait table-exists --table-name "$TABLE_NAME"
          fi
          
          # Create/Import EC2 Key Pair
          KEY_NAME="${PROJECT_NAME}-deploy-key"
          
          if ! aws ec2 describe-key-pairs --key-names "$KEY_NAME" 2>/dev/null; then
            echo "🚀 Creating EC2 Key Pair: $KEY_NAME"
            
            # Decode base64-encoded private key using step output
            echo "Debug: Attempting to decode base64 private key..."
            ENCODED_KEY="${{ steps.prepare-key.outputs.encoded_key }}"
            if echo "$ENCODED_KEY" | base64 -d > /tmp/private_key.pem 2>/tmp/base64_error.log; then
              echo "✅ Base64 decode successful"
            else
              echo "❌ Base64 decode failed:"
              cat /tmp/base64_error.log
              echo "Debug: SECRET length: ${#ENCODED_KEY} characters"
              echo "Debug: First 50 chars: ${ENCODED_KEY:0:50}"
              exit 1
            fi
            
            chmod 600 /tmp/private_key.pem
            
            # Validate private key
            KEY_SIZE=$(wc -c < /tmp/private_key.pem)
            echo "Private key size: $KEY_SIZE bytes"
            
            if [ "$KEY_SIZE" -lt 100 ]; then
              echo "❌ Private key is too small ($KEY_SIZE bytes). The EC2_PRIVATE_KEY secret appears to be empty or corrupted."
              echo "Please run the setup script again to generate and upload a valid SSH key."
              rm -f /tmp/private_key.pem
              exit 1
            fi
            
            # Test key validity
            if ! ssh-keygen -l -f /tmp/private_key.pem >/dev/null 2>&1; then
              echo "❌ Private key is invalid or corrupted. The EC2_PRIVATE_KEY secret contains an invalid SSH key."
              echo "Please run the setup script again to generate and upload a valid SSH key."
              rm -f /tmp/private_key.pem
              exit 1
            fi
            
            echo "✅ Private key is valid ($KEY_SIZE bytes)"
            
            # Generate public key from private key
            ssh-keygen -y -f /tmp/private_key.pem > /tmp/public_key.pub
            
            # Import key pair to AWS
            aws ec2 import-key-pair \
              --key-name "$KEY_NAME" \
              --public-key-material fileb:///tmp/public_key.pub
            
            echo "✅ EC2 key pair imported successfully: $KEY_NAME"
            
            # Cleanup
            rm -f /tmp/private_key.pem /tmp/public_key.pub
          else
            echo "✅ EC2 key pair already exists: $KEY_NAME"
          fi

  terraform:
    needs: [determine-environment, setup-prerequisites]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project config
        id: config
        run: |
          PROJECT_NAME=$(jq -r '.project.name' config.json)
          DOMAIN=$(jq -r '.project.domain' config.json)
          REGION=$(jq -r '.aws.region' config.json)
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          INSTANCE_TYPE=$(jq -r ".infrastructure.instance_types.${ENVIRONMENT}" config.json)
          
          echo "project_name=${PROJECT_NAME}" >> $GITHUB_OUTPUT
          echo "domain=${DOMAIN}" >> $GITHUB_OUTPUT
          echo "aws_region=${REGION}" >> $GITHUB_OUTPUT
          echo "instance_type=${INSTANCE_TYPE}" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || steps.config.outputs.aws_region }}

      - name: Set Terraform variables
        run: |
          # Set fallback values
          PROJECT_NAME="${{ vars.PROJECT_NAME }}"
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="${{ steps.config.outputs.project_name }}"
          fi
          
          DOMAIN="${{ vars.DOMAIN }}"
          if [ -z "$DOMAIN" ]; then
            DOMAIN="${{ steps.config.outputs.domain }}"
          fi
          
          AWS_REGION="${{ vars.AWS_REGION }}"
          if [ -z "$AWS_REGION" ]; then
            AWS_REGION="${{ steps.config.outputs.aws_region }}"
          fi
          
          INSTANCE_TYPE="${{ vars.INSTANCE_TYPE }}"
          if [ -z "$INSTANCE_TYPE" ]; then
            INSTANCE_TYPE="${{ steps.config.outputs.instance_type }}"
          fi
          
          # Set environment variables for Terraform
          echo "TF_VAR_project_name=$PROJECT_NAME" >> $GITHUB_ENV
          echo "TF_VAR_domain=$DOMAIN" >> $GITHUB_ENV
          echo "TF_VAR_aws_region=$AWS_REGION" >> $GITHUB_ENV
          echo "TF_VAR_environment=${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_key_name=${PROJECT_NAME}-deploy-key" >> $GITHUB_ENV
          echo "TF_VAR_instance_type=$INSTANCE_TYPE" >> $GITHUB_ENV
          echo "AWS_REGION_FOR_TERRAFORM=$AWS_REGION" >> $GITHUB_ENV
          echo "PROJECT_NAME_FOR_TERRAFORM=$PROJECT_NAME" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${PROJECT_NAME_FOR_TERRAFORM}-terraform-state" \
            -backend-config="key=${{ needs.determine-environment.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION_FOR_TERRAFORM" \
            -backend-config="dynamodb_table=${PROJECT_NAME_FOR_TERRAFORM}-terraform-locks"

      - name: Terraform Workspace
        run: |
          terraform workspace select ${{ needs.determine-environment.outputs.environment }} || \
          terraform workspace new ${{ needs.determine-environment.outputs.environment }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -detailed-exitcode -out=tfplan
          echo "plan_exitcode=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment Plan Results (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`
            
            <details><summary>Show Plan</summary>
            
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>
            
            *Environment: ${{ needs.determine-environment.outputs.environment }}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: needs.determine-environment.outputs.action == 'apply' && steps.plan.outputs.plan_exitcode == '2'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: needs.determine-environment.outputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Output Infrastructure Info
        if: needs.determine-environment.outputs.action == 'apply'
        run: |
          echo "## Infrastructure Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Bucket**: $(terraform output -raw frontend_bucket_name)" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront ID**: $(terraform output -raw frontend_cloudfront_id)" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Instance**: $(terraform output -raw backend_instance_id)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Domain**: $(terraform output -raw frontend_domain)" >> $GITHUB_STEP_SUMMARY
          echo "- **API Domain**: $(terraform output -raw api_domain)" >> $GITHUB_STEP_SUMMARY