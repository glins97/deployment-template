name: Deploy Application

on:
  push:
    branches:
      - prd
      - hml
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - hml
          - prd

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/prd" ]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/hml" ]; then
            echo "environment=hml" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  get-infrastructure-info:
    needs: determine-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    outputs:
      frontend-bucket: ${{ steps.terraform.outputs.frontend_bucket_name }}
      frontend-cloudfront-id: ${{ steps.terraform.outputs.frontend_cloudfront_id }}
      backend-instance-id: ${{ steps.terraform.outputs.backend_instance_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get existing infrastructure info
        id: terraform
        working-directory: terraform
        run: |
          # Initialize Terraform to read existing state
          terraform init \
            -backend-config="bucket=${{ vars.PROJECT_NAME }}-terraform-state" \
            -backend-config="key=${{ needs.determine-environment.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.PROJECT_NAME }}-terraform-locks"
          
          # Select workspace for the environment
          terraform workspace select ${{ needs.determine-environment.outputs.environment }}
          
          # Get outputs from existing infrastructure
          echo "frontend_bucket_name=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "frontend_cloudfront_id=$(terraform output -raw frontend_cloudfront_id)" >> $GITHUB_OUTPUT
          echo "backend_instance_id=$(terraform output -raw backend_instance_id)" >> $GITHUB_OUTPUT

  deploy-frontend:
    needs: [determine-environment, get-infrastructure-info]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create environment file for build
        working-directory: frontend
        run: |
          # Create .env file for React build
          cat > .env.production <<EOF
          REACT_APP_API_URL=https://${{ vars.API_DOMAIN }}/api
          REACT_APP_ENVIRONMENT=${{ needs.determine-environment.outputs.environment }}
          EOF
          
          # Add all environment variables from GitHub secrets/vars
          echo "REACT_APP_PROJECT_NAME=${{ vars.PROJECT_NAME }}" >> .env.production

      - name: Build React application
        working-directory: frontend
        run: |
          # Build for production
          npm run build
          
          # Verify build output
          ls -la build/
          echo "Build completed successfully"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          echo "Deploying to bucket: ${{ needs.get-infrastructure-info.outputs.frontend-bucket }}"
          aws s3 sync frontend/build/ s3://${{ needs.get-infrastructure-info.outputs.frontend-bucket }}/ \
            --delete \
            --cache-control "max-age=31536000" \
            --exclude "*.html" \
            --exclude "service-worker.js"
          
          # Upload HTML files with no cache
          aws s3 sync frontend/build/ s3://${{ needs.get-infrastructure-info.outputs.frontend-bucket }}/ \
            --delete \
            --cache-control "no-cache" \
            --include "*.html" \
            --include "service-worker.js"

      - name: Invalidate CloudFront
        run: |
          echo "Invalidating CloudFront distribution: ${{ needs.get-infrastructure-info.outputs.frontend-cloudfront-id }}"
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.get-infrastructure-info.outputs.frontend-cloudfront-id }} \
            --paths "/*"

  deploy-backend:
    needs: [determine-environment, get-infrastructure-info]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create .env file from secrets
        run: |
          # Create .env file from all GitHub environment variables and secrets
          cat > .env <<EOF
          # Django Configuration
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ secrets.DEBUG }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          
          # Database Configuration  
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_ENGINE=${{ secrets.DB_ENGINE }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          
          # CORS Configuration
          CORS_ALLOW_ALL_ORIGINS=${{ secrets.CORS_ALLOW_ALL_ORIGINS }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          
          # Environment specific
          BACKEND_URL=https://${{ vars.API_DOMAIN }}/api
          FRONTEND_URL=https://${{ vars.FRONTEND_DOMAIN }}
          EOF
          
          echo "Generated .env file with environment-specific configuration"

      - name: Get EC2 instance information
        id: instance
        run: |
          # Get EC2 instance public IP
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ needs.get-infrastructure-info.outputs.backend-instance-id }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          echo "Instance IP: $INSTANCE_IP"

      - name: Deploy to EC2
        run: |
          # Create SSH key file
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > /tmp/deploy_key.pem
          chmod 600 /tmp/deploy_key.pem
          
          # Test SSH connection
          ssh -i /tmp/deploy_key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ubuntu@${{ steps.instance.outputs.instance_ip }} "echo 'SSH connection successful'"
          
          # Create remote application directory
          ssh -i /tmp/deploy_key.pem -o StrictHostKeyChecking=no \
            ubuntu@${{ steps.instance.outputs.instance_ip }} \
            "sudo mkdir -p /opt/app && sudo chown ubuntu:ubuntu /opt/app"
          
          # Copy application files
          scp -i /tmp/deploy_key.pem -o StrictHostKeyChecking=no -r \
            backend/ docker-compose.yml .env \
            ubuntu@${{ steps.instance.outputs.instance_ip }}:/opt/app/
          
          # Deploy application
          ssh -i /tmp/deploy_key.pem -o StrictHostKeyChecking=no \
            ubuntu@${{ steps.instance.outputs.instance_ip }} << 'EOF'
            cd /opt/app
            
            echo "Stopping existing services..."
            sudo docker-compose down || true
            
            echo "Cleaning up old containers and images..."
            sudo docker system prune -f || true
            
            echo "Building and starting services..."
            sudo docker-compose up --build -d
            
            echo "Waiting for services to be ready..."
            sleep 30
            
            echo "Checking service status..."
            sudo docker-compose ps
            
            echo "Checking application logs..."
            sudo docker-compose logs --tail=20 backend
            
            echo "Testing backend health..."
            curl -f http://localhost:8000/health/ || echo "Health check failed"
            
            echo "Restarting nginx..."
            sudo systemctl restart nginx
            sudo systemctl status nginx
          EOF
          
          # Cleanup SSH key
          rm -f /tmp/deploy_key.pem

      - name: Verify deployment
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend URL**: https://${{ vars.FRONTEND_DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: https://${{ vars.API_DOMAIN }}/api" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Instance**: ${{ needs.get-infrastructure-info.outputs.backend-instance-id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment completed successfully! 🚀" >> $GITHUB_STEP_SUMMARY