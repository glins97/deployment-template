name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - hml
          - prd
      confirm_destroy:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Validate destroy confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]; then
            echo "❌ Destroy confirmation failed. You must type 'destroy' to confirm."
            exit 1
          fi
          
          if [ "${{ github.event.inputs.environment }}" = "prd" ]; then
            echo "❌ Production environment cannot be destroyed via this workflow for safety."
            echo "To destroy production, use terraform destroy manually."
            exit 1
          fi
          
          echo "✅ Destroy confirmation validated"

  terraform-destroy:
    needs: validate-input
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project config
        id: config
        run: |
          PROJECT_NAME=$(jq -r '.project.name' config.json)
          DOMAIN=$(jq -r '.project.domain' config.json)
          REGION=$(jq -r '.aws.region' config.json)
          
          echo "project_name=${PROJECT_NAME}" >> $GITHUB_OUTPUT
          echo "domain=${DOMAIN}" >> $GITHUB_OUTPUT
          echo "aws_region=${REGION}" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || steps.config.outputs.aws_region }}

      - name: Set Terraform variables
        run: |
          # Set fallback values
          PROJECT_NAME="${{ vars.PROJECT_NAME }}"
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="${{ steps.config.outputs.project_name }}"
          fi
          
          DOMAIN="${{ vars.DOMAIN }}"
          if [ -z "$DOMAIN" ]; then
            DOMAIN="${{ steps.config.outputs.domain }}"
          fi
          
          AWS_REGION="${{ vars.AWS_REGION }}"
          if [ -z "$AWS_REGION" ]; then
            AWS_REGION="${{ steps.config.outputs.aws_region }}"
          fi
          
          echo "TF_VAR_project_name=$PROJECT_NAME" >> $GITHUB_ENV
          echo "TF_VAR_environment=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "TF_VAR_domain=$DOMAIN" >> $GITHUB_ENV
          echo "TF_VAR_aws_region=$AWS_REGION" >> $GITHUB_ENV
          echo "TF_VAR_ssh_key_name=${PROJECT_NAME}-deploy-key" >> $GITHUB_ENV
          echo "PROJECT_NAME_FOR_TERRAFORM=$PROJECT_NAME" >> $GITHUB_ENV
          echo "AWS_REGION_FOR_TERRAFORM=$AWS_REGION" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${PROJECT_NAME_FOR_TERRAFORM}-terraform-state" \
            -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION_FOR_TERRAFORM}" \
            -backend-config="dynamodb_table=${PROJECT_NAME_FOR_TERRAFORM}-terraform-locks"

      - name: Terraform Workspace
        run: |
          terraform workspace select ${{ github.event.inputs.environment }}

      - name: Empty S3 bucket before destroy
        run: |
          # Get bucket name from terraform state
          BUCKET_NAME=$(terraform output -raw frontend_bucket_name 2>/dev/null || echo "")
          
          if [ ! -z "$BUCKET_NAME" ]; then
            echo "Emptying S3 bucket: $BUCKET_NAME"
            aws s3 rm s3://$BUCKET_NAME --recursive || true
          fi

      - name: Terraform Destroy Plan
        run: |
          terraform plan -destroy -detailed-exitcode
          echo "Destroy plan completed"

      - name: Terraform Destroy
        run: |
          echo "🔥 Destroying infrastructure for environment: ${{ github.event.inputs.environment }}"
          terraform destroy -auto-approve
          echo "✅ Infrastructure destroyed successfully"

      - name: Cleanup Terraform Workspace
        run: |
          # Switch to default workspace and delete the environment workspace
          terraform workspace select default
          terraform workspace delete ${{ github.event.inputs.environment }} || true

      - name: Summary
        run: |
          echo "## Destruction Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment Destroyed**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Resources Removed**: All AWS resources for this environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Terraform Workspace**: Deleted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔥 Infrastructure has been completely destroyed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: GitHub environment settings and secrets are preserved." >> $GITHUB_STEP_SUMMARY
          echo "To recreate the infrastructure, run the infrastructure workflow." >> $GITHUB_STEP_SUMMARY